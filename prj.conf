# Generic USB stuff
# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_DEVICE_SOF=y

CONFIG_USB_DEVICE_STACK_NEXT=y

# Device metadata, only used when CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_APP_MANUFACTURER_NAME="zephyr"
CONFIG_SAMPLE_APP_PRODUCT_NAME="zephyr-usb-midi"
CONFIG_SAMPLE_APP_DEVICE_PID=0x1000
CONFIG_SAMPLE_APP_DEVICE_VID=0x2FE3

# Enable USB MIDI device class
CONFIG_USB_DEVICE_MIDI=y

# USB MIDI stuff
CONFIG_USB_MIDI_NUM_INPUTS=2
CONFIG_USB_MIDI_NUM_OUTPUTS=3
CONFIG_USB_MIDI_USE_CUSTOM_JACK_NAMES=n
CONFIG_USB_MIDI_INPUT_JACK_0_NAME="Custom input name 0"
CONFIG_USB_MIDI_INPUT_JACK_1_NAME="Custom input name 1"
CONFIG_USB_MIDI_OUTPUT_JACK_0_NAME="Custom output name 0"
CONFIG_USB_MIDI_OUTPUT_JACK_1_NAME="Custom output name 1"
CONFIG_USB_MIDI_OUTPUT_JACK_2_NAME="Custom output name 2"

# Sample app config vars
CONFIG_SYSEX_ECHO_ENABLED=n
CONFIG_TX_PERIODIC_NOTE_ENABLED=n

# Debug stuff
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_LOG=y
CONFIG_USB_MIDI_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=65536
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_ASSERT=y